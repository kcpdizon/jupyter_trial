<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.css"
  >

  <script src="https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 600px;
    }

    #fly {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;

      padding: 10px 16px;

      background: white;
      border: none;
      border-radius: 4px;

      font-family: sans-serif;
      font-size: 14px;

      cursor: pointer;

      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    #fly:hover {
      background: #f5f5f5;
    }
  </style>
</head>

<body>

<button id="fly">Fly to Davao</button>

<div id="map"></div>

<script>

const map = new maplibregl.Map({

  container: 'map',

  style: 'https://tiles.openfreemap.org/styles/liberty',

  // Philippines-wide starting view
  center: [122.0, 12.0],
  zoom: 4.5

});


document.getElementById('fly').addEventListener('click', () => {

  map.flyTo({

    // Davao City
    center: [125.61, 7.07],

    // City-level street detail
    zoom: 13,

    speed: 0.7,
    curve: 1.4,

    essential: true

  });

});

</script>

</body>
</html>
